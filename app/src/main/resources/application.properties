spring.application.name=back-end
spring.main.allow-bean-definition-overriding=true
spring.main.banner-mode=off
# application started with: java -jar smartcare.jar --debug
#debug=true
#trace=false

# --------------------------------------------------
# - Security
# --------------------------------------------------
## -- Authorization --------------------------------
### --- JWT configuration
jwt.secret=${JWT_SECRET}
jwt.token.expiration.time.millis=${JWT_EXPIRATION_TIME_MILLIS}
## -- Data Security --------------------------------
### --- Data Integrity
# - Data integrity Validation Regex for Security Rules compliance.
email-validation-regex=^[a-zA-Z0-9_+&*-]+(?:\.[a-zA-Z0-9_+&*-]+)*@(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}$
#password.simple.validation.regex=^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])..{6,20}$
#password="^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])..{6,20}$"
#password=^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])..{6,20}$
password=${PASSWORD_SIMPLE_VALIDATION_REGEX}
### --- Persistence Security
#### ---- MySQl Security
spring.datasource.url=${MYSQL_DB_URL}
# - spring.datasource.url=jdbc:mysql://localhost:3306/smartcare_coursera
spring.datasource.username=${MYSQL_DB_USERNAME}
# - spring.datasource.username=samuel
spring.datasource.password=${MYSQL_DB_PASSWORD}
# - spring.datasource.password=sam321
### --- MongoDB Security
# - spring.data.mongodb.uri=${MONGO_DB_URL}
spring.data.mongodb.uri=mongodb://samuel:sam321@localhost:27017/prescriptions?authSource=samuel

# --------------------------------------------------
# - Observability
# --------------------------------------------------
## -- Logging --------------------------------------
logging.file.name=logs/smartcare-app.log
# - If file.name and file.path are provided, only file.name is used.
# - Log files rotate when they reach 10 MB and, as with console output, ERROR-level, WARN-level, and INFO-level messages
#   are logged by default. Note that Log4J2 requires logging.file.path to be set with such configuration.
logging.file.path=logs
# - Logging detail level: TRACE, DEBUG, INFO, WARN, ERROR, FATAL, or OFF
#logging.level.root=warn
logging.level.com.project.back_end=DEBUG
logging.include-application-name=false
logging.include-application-group=false
logging.console.enabled=true
spring.output.ansi.enabled=true

# --------------------------------------------------
# - Data Persistence
# --------------------------------------------------
## -- Database connectivity and Management ---------
### MySQL Database connection
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
### --- JPA
#spring.jpa.show-sql=true
spring.jpa.open-in-view=false
#### ---- Hibernate
# - To automatically validateDoctor the mapping; Using this feature will check that our entities match the created schema
#   on application start-up. Hibernate would throw a SchemaManagementException on application start-up.
#   - source: https://www.arhohuttunen.com/spring-boot-datajpatest/#validate-entity-mapping
# It is recommended to use update while on development face.
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
### --- MongoDB

# -------------------------------------------------
# - Web
# -------------------------------------------------
## -- General settings ----------------------------
api.path=/
management.endpoint.health.show-details=always
management.health.db.enabled=true
## -- Spring Web ----------------------------------
# - This setting tells Spring Boot where to look for static assets (e.g., CSS, JS, images).
# - Files placed in src/main/resources/static/ will be served directly by Spring without the need for a Controller.
spring.web.resources.static-locations=classpath:/static/
## -- Thymeleaf Configuration /templates?? --------
spring.thymeleaf.prefix=classpath:/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
# - Useful during development to see changes immediately without restarting the app.
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
